<!doctype html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>glTF Studio — 模型剖切 / 爆炸 / 标注工作台</title>
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
	/>
	<meta name="author" content="Don McCurdy; glTF Studio additions by llinok111" />
	<meta
		name="description"
		content="Drag-and-drop glTF 2.0 viewer with live cross-section, exploded view, part tree, 3D annotations and measurement."
	/>
	<link rel="shortcut icon" href="/favicon.ico" />
	<link rel="stylesheet" href="style.css" />
	<link rel="stylesheet" href="studio.css" />
	<link href="https://fonts.googleapis.com/css?family=Raleway:300,400" rel="stylesheet" />
	<script defer type="module" src="src/app.js"></script>
</head>
<body>
	<header>
		<h1><a href="/">glTF Viewer</a></h1>
	</header>
	<main class="wrap">
		<div class="dropzone">
			<div class="placeholder">
				<p>拖入 glTF 2.0 文件或文件夹</p>
				<p class="ph-sub">支持 .glb / .gltf / .zip（含贴图与 .bin）</p>
			</div>
			<div class="upload-btn">
				<input type="file" name="file-input[]" id="file-input" multiple="" />
				<label for="file-input">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="17"
						viewBox="0 0 20 17"
					>
						<path
							d="M10 0l-5.2 4.9h3.3v5.1h3.8v-5.1h3.3l-5.2-4.9zm9.3 11.5l-3.2-2.1h-2l3.4 2.6h-3.5c-.1 0-.2.1-.2.1l-.8 2.3h-6l-.8-2.2c-.1-.1-.1-.2-.2-.2h-3.6l3.4-2.6h-2l-3.2 2.1c-.4.3-.7 1-.6 1.5l.6 3.1c.1.5.7.9 1.2.9h16.3c.6 0 1.1-.4 1.3-.9l.6-3.1c.1-.5-.2-1.2-.7-1.5z"
						></path>
					</svg>
					<span>选择文件</span>
				</label>
			</div>
			<p class="ph-links">
				<a href="?model=/assets/models/RoboticArm.glb">载入示例：五轴机械臂（11 个零件 / 11 级嵌套）</a>
			</p>
		</div>
		<div class="spinner"></div>
	</main>
</body>
